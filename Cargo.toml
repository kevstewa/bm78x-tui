[package]
name = "bm78x-tui"
description = "Terminal UI for Brymen BM78xBT Bluetooth multimeters"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/kevstewa/bm78x-tui"
readme = "README.md"
keywords = ["brymen", "multimeter", "bluetooth", "tui", "bm787"]
categories = ["command-line-utilities", "hardware-support"]
# crates.io shows the README's screenshot from the repository.
exclude = ["/docs"]

[dependencies]
bm78x = "0.1.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
ratatui = { version = "0.30.2", features = ["crossterm_0_29"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "signal", "sync", "time"] }
unicode-width = "0.2.2"

[lints.rust]
unsafe_code = "forbid"
